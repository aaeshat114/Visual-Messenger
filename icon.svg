<?xml version="1.0" encoding="UTF-8"?>
<!--
  icon.svg: the app icon, used by the manifest (both "any" and "maskable"),
  by index.html as the favicon, and by sw.js as the notification icon.

  MASKABLE SAFE ZONE: Android may crop this icon to a circle or squircle.
  The background fills the whole 512x512 square (so no white corners appear
  after cropping), and ALL artwork sits inside a circle of radius ~205 from
  the centre (256, 256). The farthest point of the bubble is ~167 away, so
  nothing important gets cut off.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img">
  <title>Visual Messenger</title>

  <defs>
    <!-- Pastel rainbow, using the palette from app.css (--c-red ... --c-purple) -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#FFB3BA"/>
      <stop offset="20%"  stop-color="#FFD5B3"/>
      <stop offset="40%"  stop-color="#FFF5B3"/>
      <stop offset="60%"  stop-color="#B3E6C4"/>
      <stop offset="80%"  stop-color="#B3D9FF"/>
      <stop offset="100%" stop-color="#D9B3FF"/>
    </linearGradient>

    <!-- Soft shadow under the bubble -->
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#3D3A4E" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Full-bleed background (no rounded corners here: the OS applies its own mask) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Speech bubble: rounded rectangle plus a rounded tail at the lower left -->
  <g filter="url(#soft)" fill="#FFFDF9">
    <rect x="116" y="128" width="280" height="210" rx="56" ry="56"/>
    <!-- Tail: a triangle with round joins, drawn as a stroked + filled path -->
    <path d="M 184 326 L 168 392 L 246 336 Z"
          stroke="#FFFDF9" stroke-width="16" stroke-linejoin="round"/>
  </g>

  <!-- Four answer cards inside the bubble (2 x 2 grid) -->
  <rect x="152" y="159" width="96" height="66" rx="22" fill="#FFB3BA"/>
  <rect x="264" y="159" width="96" height="66" rx="22" fill="#FFF5B3"/>
  <rect x="152" y="241" width="96" height="66" rx="22" fill="#B3E6C4"/>
  <rect x="264" y="241" width="96" height="66" rx="22" fill="#B3D9FF"/>
</svg>
